<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Transfer — Offline Data Transfer via QR Codes</title>
    <meta name="description" content="Transfer data between devices using QR codes. No network required.">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-card: #1c1c1e;
            --bg-card-hover: #2c2c2e;
            --accent: #0071e3;
            --accent-hover: #0077ED;
            --accent-subtle: rgba(0,113,227,0.12);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --text-muted: #6e6e73;
            --border: #38383a;
            --success: #30d158;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px;
        }

        .container { max-width: 580px; width: 100%; }

        .header { text-align: center; margin-bottom: 56px; }

        .logo {
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .lang-toggle {
            display: inline-block;
            margin-top: 16px;
            background: rgba(255,255,255,0.06);
            border: none;
            border-radius: 980px;
            padding: 3px;
            cursor: pointer;
        }

        .lang-toggle button {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 5px 16px;
            border-radius: 980px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .lang-toggle button.active {
            background: var(--accent);
            color: #fff;
        }

        /* Cards */
        .cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 48px;
        }

        .mode-label {
            margin: 28px 4px 12px;
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .card.fast { border: 1px solid rgba(48,209,88,0.35); }
        .card.fast .card-icon { background: rgba(48,209,88,0.12); }

        .card {
            background: var(--bg-card);
            border: none;
            border-radius: 16px;
            padding: 28px 24px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: left;
            width: 100%;
            display: block;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            background: var(--bg-card-hover);
        }

        .card.recv:hover {
            background: var(--bg-card-hover);
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 16px;
        }

        .card-icon.send { background: var(--accent-subtle); }
        .card-icon.recv { background: var(--accent-subtle); }

        .card h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.6;
        }

        .card .tag {
            display: inline-block;
            font-size: 0.72rem;
            padding: 3px 10px;
            border-radius: 980px;
            margin-top: 12px;
            margin-right: 4px;
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
        }

        /* Features */
        .features {
            border-top: none;
            padding-top: 0;
            margin-bottom: 40px;
        }

        .features h3 {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 18px;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .feat {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 0.84rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .feat::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 6px;
        }

        /* Footer */
        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.78rem;
            line-height: 1.8;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            border-bottom: 1px solid var(--border);
        }

        /* Badge */
        .badge {
            display: inline-block;
            background: var(--accent-subtle);
            color: var(--accent);
            padding: 3px 12px;
            border-radius: 980px;
            font-size: 0.72rem;
            font-weight: 500;
        }

        /* Top Nav */
        .top-nav { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:rgba(0,0,0,0.85); border-bottom:1px solid var(--border); position:fixed; top:0; left:0; right:0; z-index:100; }
        .top-nav a.nav-logo { color:var(--text-primary); text-decoration:none; font-weight:600; font-size:1rem; letter-spacing:-0.01em; }
        .top-nav .nav-links { display:flex; gap:4px; }
        .top-nav .nav-links a { padding:6px 16px; border-radius:980px; text-decoration:none; font-size:0.85rem; color:var(--text-secondary); transition:color 0.2s, background-color 0.2s; }
        .top-nav .nav-links a:hover { color:var(--text-primary); background:rgba(255,255,255,0.08); }
        .top-nav .nav-links a.active-send { color:#fff; background:var(--accent); }
        .top-nav .nav-links a.active-recv { color:#fff; background:var(--accent); }
        .top-nav .nav-lang { display:flex; gap:2px; background:rgba(255,255,255,0.06); border-radius:980px; padding:2px; }
        .top-nav .nav-lang button { background:none; border:none; color:var(--text-muted); padding:4px 12px; border-radius:980px; font-size:0.75rem; cursor:pointer; transition:background-color 0.2s, color 0.2s; }
        .top-nav .nav-lang button.active { background:var(--accent); color:#fff; }

        @media (max-width: 500px) {
            body { padding: 20px; padding-top: 60px; }
            .logo { font-size: 1.9rem; }
            .feature-grid { grid-template-columns: 1fr; }
            .card { padding: 24px 20px; }
        }
    </style>
</head>
<body>
    <nav class="top-nav" id="topNav">
        <a class="nav-logo" href="index.html">QR Transfer</a>
        <div class="nav-links">
            <a href="sender.html" data-zh="发送" data-en="Sender">发送</a>
            <a href="receiver.html" data-zh="接收" data-en="Receiver">接收</a>
        </div>
        <div class="nav-lang" id="langToggle">
            <button data-lang="zh" class="active">中文</button>
            <button data-lang="en">EN</button>
        </div>
    </nav>
    <div class="container" style="padding-top: 56px;">
        <div class="header">
            <div class="logo">QR Transfer</div>
            <p class="subtitle">
                <span data-zh="无需网络，通过二维码在设备间传输数据" data-en="Transfer data between devices via QR codes — no network needed"></span>
            </p>
            <div style="margin-top: 12px;"><span class="badge">v3 &nbsp;Classic + Enhanced</span></div>
        </div>

        <div class="mode-label" data-zh="经典传输 · 稳定兼容" data-en="Classic · Stable and compatible">经典传输 · 稳定兼容</div>
        <div class="cards">
            <a class="card" href="sender.html">
                <div class="card-icon send">📤</div>
                <h2 data-zh="发送端" data-en="Sender"></h2>
                <p>
                    <span data-zh="将文本或文件编码为二维码序列，支持任意文件类型" data-en="Encode text or files into a QR code sequence. Supports any file type"></span>
                </p>
                <span class="tag t1" data-zh="通用模式" data-en="Universal"></span>
                <span class="tag t2" data-zh="分片传输" data-en="Chunked"></span>
                <span class="tag t3" data-zh="文件传输" data-en="File Transfer"></span>
            </a>

            <a class="card recv" href="receiver.html">
                <div class="card-icon recv">📥</div>
                <h2 data-zh="接收端" data-en="Receiver"></h2>
                <p>
                    <span data-zh="通过摄像头扫描二维码，自动识别并还原文本或文件" data-en="Scan QR codes with camera to automatically reassemble text or files"></span>
                </p>
                <span class="tag t1" data-zh="自动识别" data-en="Auto-detect"></span>
                <span class="tag t2" data-zh="完整性校验" data-en="Checksum"></span>
                <span class="tag t3" data-zh="断点续传" data-en="Resumable"></span>
            </a>
        </div>

        <div class="mode-label" data-zh="增强传输 · RaptorQ 高速恢复" data-en="Enhanced · RaptorQ high-speed recovery">增强传输 · RaptorQ 高速恢复</div>
        <div class="cards">
            <a class="card fast" href="sender-fast.html">
                <div class="card-icon send">⚡</div>
                <h2 data-zh="增强发送端" data-en="Enhanced Sender">增强发送端</h2>
                <p><span data-zh="RaptorQ 喷泉码与 1/2/4 二维码并行播放；默认双码，不再依赖固定缺片重传" data-en="RaptorQ fountain coding with 1/2/4 parallel QR playback; dual QR by default"></span></p>
                <span class="tag" data-zh="默认双码" data-en="Dual QR default"></span>
                <span class="tag">RaptorQ</span>
                <span class="tag">CRC32C</span>
            </a>

            <a class="card fast" href="receiver-fast.html">
                <div class="card-icon recv">🛡️</div>
                <h2 data-zh="增强接收端" data-en="Enhanced Receiver">增强接收端</h2>
                <p><span data-zh="多码识别、前后摄像头、丢包恢复、逐包 CRC 与最终 SHA-256 校验" data-en="Multi-code scanning, front/rear cameras, loss recovery, CRC and final SHA-256 verification"></span></p>
                <span class="tag" data-zh="前后摄像头" data-en="Front / rear camera"></span>
                <span class="tag" data-zh="丢包恢复" data-en="Loss recovery"></span>
                <span class="tag">SHA-256</span>
            </a>
        </div>

        <div class="features">
            <h3 data-zh="核心特性" data-en="Features"></h3>
            <div class="feature-grid">
                <div class="feat"><span data-zh="完全离线，零网络依赖" data-en="Fully offline, zero network"></span></div>
                <div class="feat"><span data-zh="单文件运行，无需安装" data-en="Single-file, no install"></span></div>
                <div class="feat"><span data-zh="兼容微信/支付宝扫码" data-en="Works with WeChat/Alipay"></span></div>
                <div class="feat"><span data-zh="长文本自动分片" data-en="Auto-chunking for long text"></span></div>
                <div class="feat"><span data-zh="支持任意文件类型" data-en="Any file type supported"></span></div>
                <div class="feat"><span data-zh="校验和保障数据完整" data-en="Checksum verification"></span></div>
                <div class="feat"><span data-zh="会话恢复，断点续传" data-en="Session recovery"></span></div>
                <div class="feat"><span data-zh="跨平台，手机电脑通用" data-en="Cross-platform"></span></div>
            </div>
        </div>

        <div class="footer">
            <p data-zh="所有数据仅在浏览器本地处理，不会上传至任何服务器" data-en="All data is processed locally in your browser — nothing is uploaded"></p>
            <p style="margin-top: 6px;">&copy; 2025 QR Transfer &middot; <a href="https://github.com/ttieli/Scan2" target="_blank">GitHub</a> &middot; MIT License</p>
            <p style="margin-top: 4px;"><span data-zh="最后更新" data-en="Last updated">最后更新</span>: <span id="buildTime"></span></p>
        </div>
    </div>

    <script>
    (function() {
        var stored = null;
        try { stored = localStorage.getItem('qr_lang'); } catch(e) {}
        var lang = stored || ((navigator.language || '').startsWith('zh') ? 'zh' : 'en');

        function applyLang(l) {
            lang = l;
            try { localStorage.setItem('qr_lang', l); } catch(e) {}
            document.querySelectorAll('[data-zh]').forEach(function(el) {
                el.textContent = el.getAttribute('data-' + l) || el.getAttribute('data-en');
            });
            document.querySelectorAll('#langToggle button').forEach(function(btn) {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === l);
            });
            document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
        }

        document.getElementById('langToggle').addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON') {
                applyLang(e.target.getAttribute('data-lang'));
            }
        });

        applyLang(lang);
    })();
    </script>
    <script>document.getElementById('buildTime').textContent=new Date('2026-02-03T08:30:00Z').toLocaleString();</script>
</body>
</html>

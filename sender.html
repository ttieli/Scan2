<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR发送端 - 完全离线版</title>
<style>
:root {
    --bg-primary: #000000;
    --bg-card: #1c1c1e;
    --bg-card-hover: #2c2c2e;
    --bg-input: #1c1c1e;
    --accent: #0071e3;
    --accent-hover: #0077ED;
    --accent-subtle: rgba(0,113,227,0.12);
    --text-primary: #f5f5f7;
    --text-secondary: #86868b;
    --text-muted: #6e6e73;
    --border: #38383a;
    --border-light: #48484a;
    --success: #30d158;
    --warning: #ff9f0a;
    --error: #ff453a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); }
.container { max-width: 900px; margin: 0 auto; padding: 24px; }
.header { text-align: center; margin-bottom: 36px; }
.header h1 { color: var(--text-primary); font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; }
.header p { color: var(--text-secondary); font-size: 0.9rem; }
.section { background: var(--bg-card); padding: 28px; margin-bottom: 24px; border-radius: 16px; }
.btn { background: var(--accent); color: #fff; border: none; padding: 14px 28px; border-radius: 980px; cursor: pointer; font-size: 15px; font-weight: 500; transition: background-color 0.2s; letter-spacing: -0.01em; }
.btn:hover { background: var(--accent-hover); }
.btn:active { opacity: 0.85; }
textarea { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px; min-height: 120px; font-family: inherit; font-size: 14px; background: var(--bg-input); color: var(--text-primary); resize: vertical; }
textarea::placeholder { color: var(--text-muted); }
textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
/* Tab Switcher */
.tab-switcher { display: flex; gap: 0; margin-bottom: 18px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg-input); }
.tab-btn { flex: 1; padding: 10px 16px; background: transparent; border: none; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-secondary); transition: color 0.2s, background-color 0.2s; }
.tab-btn.active { background: var(--accent); color: #fff; }
.tab-btn:hover:not(.active) { background: var(--bg-card-hover); color: var(--text-primary); }
/* Display mode selector */
.mode-selector { display: flex; gap: 8px; margin-bottom: 20px; }
.mode-btn { flex: 1; padding: 10px; background: transparent; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; color: var(--text-secondary); font-size: 13px; font-weight: 500; transition: color 0.2s, background-color 0.2s, border-color 0.2s; }
.mode-btn:hover { border-color: var(--border-light); color: var(--text-primary); }
.mode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
/* Options panel */
.options-panel { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
.option-group { flex: 1; min-width: 180px; }
.option-group label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.85rem; color: var(--text-secondary); }
.option-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-input); color: var(--text-primary); font-size: 13px; }
.option-group select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
/* QR display */
.qr-display { background: var(--bg-input); padding: 24px; border-radius: 16px; min-height: 300px; }
.qr-display.grid-mode { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.qr-display.loop-mode { display: flex; justify-content: center; align-items: center; min-height: 400px; }
.qr-display.single-mode { display: flex; justify-content: center; align-items: center; min-height: 400px; }
.qr-display.single-mode .qr-item { transform: none; box-shadow: none; background: transparent; }
.qr-item { background: #fff; padding: 15px; border-radius: 12px; text-align: center; color: #333; }
/* Fullscreen Single Mode */
#singleQRContainer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
#singleQRContent { --display-qr-size:220px; width:min(var(--display-qr-size), calc(100vw - 80px), calc(100vh - 250px)); height:min(var(--display-qr-size), calc(100vw - 80px), calc(100vh - 250px)); background:#fff; padding:10px; border-radius:16px; display:flex; justify-content:center; align-items:center; flex:0 0 auto; }
#singleQRContent canvas, #singleQRContent img, #singleQRContent svg { width:100% !important; height:100% !important; max-width:100%; max-height:100%; object-fit:contain; display:block; }
.qr-size-control { width:min(360px, calc(100vw - 40px)); margin-top:14px; padding:10px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:12px; }
.qr-size-control label { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; color:var(--text-secondary); font-size:13px; }
.qr-size-control output { color:var(--text-primary); font-variant-numeric:tabular-nums; font-weight:600; }
.qr-size-control input[type="range"] { width:100%; accent-color:var(--accent); }
#singleQRControls { margin-top: 20px; display: flex; gap: 15px; align-items: center; background: var(--bg-card); padding: 10px 20px; border-radius: 980px; }
#singleQRControls button { background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border); }
#singleQRControls button:hover { background: var(--bg-card-hover); }
#singleQRControls span { color: var(--text-secondary); }
#singleQRInfo { margin-top: 10px; font-size: 16px; color: var(--text-primary); font-weight: 600; }
.close-single-mode { position: absolute; top: 20px; right: 20px; background: var(--error); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
#fullscreenLoopControls { margin-top: 15px; display: flex; gap: 15px; align-items: center; background: var(--bg-card); padding: 10px 20px; border-radius: 980px; }
#fullscreenLoopControls button { padding: 8px 20px; border: none; border-radius: 980px; cursor: pointer; font-weight: 500; font-size: 14px; }
#fullscreenLoopControls span { color: var(--text-secondary); font-size: 14px; font-weight: 600; }
/* File upload */
.drop-zone { border: 2px dashed var(--border-light); border-radius: 16px; padding: 40px 20px; text-align: center; background: var(--bg-input); cursor: pointer; transition: border-color 0.2s, background-color 0.2s; color: var(--text-secondary); }
.drop-zone:hover { border-color: var(--accent); background: var(--accent-subtle); }
.drop-zone.drag-over { border-color: var(--accent); background: var(--accent-subtle); }
.drop-zone p { color: var(--text-secondary); }
.file-info { margin-top: 16px; padding: 18px; background: var(--bg-input); border-radius: 12px; }
.file-info h3 { margin: 0 0 12px 0; color: var(--text-primary); font-size: 15px; }
.estimate { font-size: 14px; line-height: 1.6; background: rgba(255,159,10,0.08); border: 1px solid rgba(255,159,10,0.2); border-radius: 12px; padding: 12px; }
.estimate strong { color: var(--warning); }
/* Hidden mode selection */
.mode-selection { display: none; }
.text-protocol-selector { display:flex; gap:6px; margin-top:12px; padding:4px; background:var(--bg-input); border:1px solid var(--border); border-radius:12px; }
.text-protocol-btn { flex:1; border:0; border-radius:9px; padding:10px 12px; background:transparent; color:var(--text-secondary); cursor:pointer; font-weight:600; }
.text-protocol-btn.active { background:var(--accent); color:#fff; }
/* Details/summary */
details summary { color: var(--text-secondary); font-size: 0.9rem; cursor: pointer; }
details summary:hover { color: var(--text-primary); }
/* Top Nav */
.top-nav { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:rgba(0,0,0,0.85); border-bottom:1px solid var(--border); }
.top-nav a.nav-logo { color:var(--text-primary); text-decoration:none; font-weight:600; font-size:1rem; letter-spacing:-0.01em; }
.top-nav .nav-links { display:flex; gap:4px; }
.top-nav .nav-links a { padding:6px 16px; border-radius:980px; text-decoration:none; font-size:0.85rem; color:var(--text-secondary); transition:color 0.2s, background-color 0.2s; }
.top-nav .nav-links a:hover { color:var(--text-primary); background:rgba(255,255,255,0.08); }
.top-nav .nav-links a.active-send { color:#fff; background:var(--accent); }
.top-nav .nav-links a.active-recv { color:#fff; background:var(--accent); }
.top-nav .nav-lang { display:flex; gap:2px; background:rgba(255,255,255,0.06); border-radius:980px; padding:2px; }
.top-nav .nav-lang button { background:none; border:none; color:var(--text-muted); padding:4px 12px; border-radius:980px; font-size:0.75rem; cursor:pointer; transition:background-color 0.2s, color 0.2s; }
.top-nav .nav-lang button.active { background:var(--accent); color:#fff; }
/* Mobile */
@media (max-width: 600px) {
    .container { padding: 14px; }
    .section { padding: 20px; }
    .options-panel { flex-direction: column; gap: 10px; }
    .option-group { min-width: 100%; }
    .qr-display.grid-mode { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
}
</style>
</head>
<body>
<nav class="top-nav" id="topNav">
    <a class="nav-logo" href="index.html">QR Transfer</a>
    <div class="nav-links">
        <a href="sender.html" class="active-send" data-zh="发送" data-en="Sender">发送</a>
        <a href="receiver.html" data-zh="接收" data-en="Receiver">接收</a>
    </div>
    <div class="nav-lang" id="langToggle">
        <button data-lang="zh">中文</button>
        <button data-lang="en">EN</button>
    </div>
</nav>
<div class="container">
    <div class="header">
        <h1><span data-zh="📤 QR数据发送器" data-en="📤 QR Sender"></span></h1>
        <p><span data-zh="完全离线版 - 无需网络连接" data-en="Fully offline — no network needed"></span></p>
    </div>

    <div class="section">
        <h2><span data-zh="数据输入" data-en="Input"></span></h2>

        <!-- Tab Switcher -->
        <div class="tab-switcher" id="inputTabSwitcher">
            <button class="tab-btn active" data-tab="text" onclick="switchInputTab('text')" data-zh="文本" data-en="Text">文本</button>
            <button class="tab-btn" data-tab="file" onclick="switchInputTab('file')" data-zh="文件" data-en="File">文件</button>
        </div>

        <!-- Text Tab -->
        <div id="tab-text">
            <textarea id="textInput" data-placeholder-zh="输入要传输的文本..." data-placeholder-en="Enter text to transfer..." placeholder="输入要传输的文本..."></textarea>
            <div class="text-protocol-selector" id="textModeSelector" aria-label="文本二维码模式">
                <button type="button" class="text-protocol-btn active" data-text-mode="universal" onclick="setTextProtocolMode('universal')" data-zh="公有 · 任意扫描器" data-en="Public · Any Scanner">公有 · 任意扫描器</button>
                <button type="button" class="text-protocol-btn" data-text-mode="private" onclick="setTextProtocolMode('private')" data-zh="私有 · 快速拼接" data-en="Private · Fast Reassembly">私有 · 快速拼接</button>
            </div>
        </div>

        <!-- File Tab -->
        <div id="tab-file" style="display:none;">
            <div id="file-upload-area" style="margin-top: 0;">
                <div class="drop-zone" id="dropZone">
                    <p style="font-size: 18px; margin-bottom: 10px;" data-zh="📤 拖拽文件到这里" data-en="📤 Drop file here">📤 拖拽文件到这里</p>
                    <p style="color: var(--text-muted); margin-bottom: 15px;" data-zh="或" data-en="or">或</p>
                    <button class="btn" onclick="document.getElementById('fileInput').click()" type="button" data-zh="选择文件" data-en="Choose File">选择文件</button>
                    <input type="file" id="fileInput" style="display: none;" onchange="handleFileInputChange(event)">
                </div>
                <div id="file-info-display" class="file-info" style="display: none;">
                    <h3><span data-zh="📄 文件信息" data-en="📄 File Info"></span></h3>
                    <div style="margin-top: 10px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="color: var(--text-secondary);" data-zh="文件名:" data-en="Name:">文件名:</span>
                            <span id="fileName" style="font-weight: bold;"></span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="color: var(--text-secondary);" data-zh="文件大小:" data-en="Size:">文件大小:</span>
                            <span id="fileSize" style="font-weight: bold;"></span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="color: var(--text-secondary);" data-zh="文件类型:" data-en="Type:">文件类型:</span>
                            <span id="fileType" style="font-weight: bold;"></span>
                        </div>
                        <div id="qrEstimate" class="estimate" style="margin-top: 15px;">
                            <span data-zh="预计二维码数量:" data-en="Estimated QR count:"><strong>预计二维码数量:</strong></span> <span id="estimatedQRCount">0</span><br>
                            <span data-zh="预计扫描时间:" data-en="Estimated scan time:"><strong>预计扫描时间:</strong></span> <span id="estimatedScanTime">0</span> <span data-zh="分钟" data-en="min">分钟</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hidden mode selection (auto-set by JS) -->
        <div class="mode-selection" style="display:none;">
            <div style="display: flex; gap: 15px;">
                <label><input type="radio" name="qrMode" value="universal" checked onchange="handleModeChange()"><span><strong>通用模式</strong></span></label>
                <label><input type="radio" name="qrMode" value="private" onchange="handleModeChange()"><span><strong>私有模式</strong></span></label>
            </div>
        </div>

        <!-- Hidden universal error level (synced from main selector) -->
        <div id="error-level-container" style="display:none;">
            <select id="universalErrorLevel" onchange="handleErrorLevelChange()">
                <option value="L">L</option><option value="M">M</option><option value="Q">Q</option><option value="H">H</option>
            </select>
            <span id="capacityHint"></span>
        </div>

        <!-- Estimation hint -->
        <div id="estimate-hint" style="display:none; margin-top: 12px; padding: 10px 14px; background: var(--accent-subtle); border-radius: 12px; border: 1px solid rgba(0,113,227,0.25); font-size: 14px; color: var(--accent);"></div>

        <!-- Advanced Options -->
        <details id="advanced-options" style="margin-top: 12px;">
            <summary style="cursor:pointer; font-weight:500; padding:8px 0;" data-zh="高级选项" data-en="Advanced Options">高级选项</summary>
            <div class="options-panel">
                <div class="option-group" id="optgroup-error">
                    <label data-zh="纠错级别" data-en="Error Correction">纠错级别</label>
                    <select id="errorLevel">
                        <option value="L">L - 低 (7%纠错，数据最多)</option>
                        <option value="M">M - 中 (15%纠错)</option>
                        <option value="Q">Q - 较高 (25%纠错)</option>
                        <option value="H" selected>H - 高 (30%纠错，数据最少)</option>
                    </select>
                </div>
                <div class="option-group" id="optgroup-chunk">
                    <label data-zh="分片策略" data-en="Chunk Strategy">分片策略</label>
                    <select id="chunkStrategy">
                        <option value="auto" selected>自动优化</option>
                        <option value="small">小分片 (15字符)</option>
                        <option value="medium">中分片 (30字符)</option>
                        <option value="large">大分片 (50字符)</option>
                        <option value="xlarge">超大分片 (80字符)</option>
                    </select>
                </div>
                <div class="option-group" id="optgroup-speed">
                    <label data-zh="循环速度" data-en="Loop Speed">循环速度</label>
                    <select id="loopSpeed" onchange="updateLoopSpeed()">
                        <option value="50">超闪电 (0.05秒)</option>
                        <option value="100" selected>闪电 (0.1秒)</option>
                        <option value="300">极快 (0.3秒)</option>
                        <option value="500">很快 (0.5秒)</option>
                        <option value="1000">快速 (1秒)</option>
                        <option value="2000">正常 (2秒)</option>
                        <option value="3000">慢速 (3秒)</option>
                        <option value="5000">超慢 (5秒)</option>
                    </select>
                </div>
            </div>
        </details>

        <button class="btn" onclick="generateQR()" style="margin-top: 15px; font-size: 16px;" id="generateBtn" data-zh="生成二维码" data-en="Generate QR Codes">生成二维码</button>
    </div>

    <div class="section" id="display-section" style="display:none;">
        <h2><span data-zh="显示模式" data-en="Display Mode"></span></h2>
        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode('grid')" data-zh="平铺显示" data-en="Grid">平铺显示</button>
            <button class="mode-btn" onclick="setMode('loop')" data-zh="循环播放" data-en="Loop">循环播放</button>
            <button class="mode-btn" onclick="setMode('single')" data-zh="单张显示" data-en="Single">单张显示</button>
        </div>
        <div id="singleControls" style="display:none; margin-top: 15px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button onclick="previousQR()" style="padding: 8px 16px; background: var(--bg-card-hover); color: var(--text-primary); border: 1px solid var(--border); border-radius: 980px; cursor: pointer;">⬅ 上一张</button>
                <span id="qrIndex" style="flex: 1; text-align: center; font-weight: 600; color: var(--text-primary);">1 / 1</span>
                <button onclick="nextQR()" style="padding: 8px 16px; background: var(--bg-card-hover); color: var(--text-primary); border: 1px solid var(--border); border-radius: 980px; cursor: pointer;">下一张 ➡</button>
            </div>
            <div style="margin-top: 10px;">
                <label style="display: block; margin-bottom: 5px;">直接跳转到：</label>
                <select id="qrSelector" onchange="jumpToQR()" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-input); color: var(--text-primary);"></select>
            </div>
        </div>
        <div id="loopControls" style="display:none; margin-top: 15px;">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                <button id="pauseBtn" onclick="togglePause()" style="padding: 8px 20px; background: var(--warning); color: var(--bg-primary); border: none; border-radius: 980px; cursor: pointer; font-weight: 500;">⏸ 暂停</button>
                <span id="loopStatus" style="flex: 1; text-align: center; font-weight: bold; color: var(--success);">▶ 播放中</span>
                <span id="loopQrIndex" style="font-weight: bold;">1 / 1</span>
            </div>
            <div style="background: var(--bg-input); padding: 12px; border-radius: 12px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">循环范围设置：</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div style="flex: 1;">
                        <label style="font-size: 12px; color: var(--text-secondary);">起始片：</label>
                        <input type="number" id="loopStart" min="1" value="1" onchange="updateLoopRange()"
                               style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); color: var(--text-primary);">
                    </div>
                    <span style="padding: 0 5px;">至</span>
                    <div style="flex: 1;">
                        <label style="font-size: 12px; color: var(--text-secondary);">结束片：</label>
                        <input type="number" id="loopEnd" min="1" value="1" onchange="updateLoopRange()"
                               style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); color: var(--text-primary);">
                    </div>
                    <button onclick="resetLoopRange()" style="padding: 6px 14px; background: var(--bg-card-hover); color: var(--text-primary); border: 1px solid var(--border); border-radius: 980px; cursor: pointer; white-space: nowrap;">重置</button>
                </div>
                <div style="margin-top: 8px; font-size: 12px; color: var(--text-muted);">
                    提示：可设置循环范围，如 4-50 表示只循环第4片到第50片
                </div>
            </div>
        </div>
        <div style="margin-top: 15px; background: var(--bg-input); padding: 12px; border-radius: 12px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 500;" data-zh="指定片段：" data-en="Fragments:">指定片段：</label>
            <div style="display: flex; gap: 8px; align-items: center;">
                <input type="text" id="fragmentNumbersInput" data-placeholder-zh="如: 1, 34, 37, 121, 246" data-placeholder-en="e.g. 1, 34, 37, 121, 246" placeholder="如: 1, 34, 37, 121, 246"
                       style="flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); color: var(--text-primary); font-family: monospace;">
                <button onclick="applyFragmentNumbers()" style="padding: 6px 14px; background: var(--accent); color: #fff; border: none; border-radius: 980px; cursor: pointer; white-space: nowrap;" data-zh="应用" data-en="Apply">应用</button>
                <button onclick="clearFragmentNumbers()" style="padding: 6px 14px; background: var(--bg-card-hover); color: var(--text-primary); border: 1px solid var(--border); border-radius: 980px; cursor: pointer; white-space: nowrap;" data-zh="清除" data-en="Clear">清除</button>
            </div>
            <div id="fragmentNumbersStatus" style="margin-top: 6px; font-size: 12px; color: var(--text-muted);" data-zh="输入要循环的片段编号，逗号分隔。留空=全部循环" data-en="Enter fragment numbers, comma-separated. Empty=loop all">输入要循环的片段编号，逗号分隔。留空=全部循环</div>
        </div>
    </div>

    <div class="section" id="qr-output-section" style="display:none;">
        <h2><span data-zh="二维码显示" data-en="QR Code Output"></span></h2>
        <div class="qr-display grid-mode" id="qrDisplay"></div>
        <div id="gridPagination" style="display:none; margin-top:12px; align-items:center; justify-content:center; gap:10px;">

// 应用代码
let mode = 'grid';
let qrCodes = [];
let currentQRSource = null;
let gridPage = 0;
let currentIndex = 0;
let loopInterval = null;
let loopSpeed = 100;
let qrCache = new Map(); // bounded LRU: index -> data URL
let textProtocolMode = 'universal';
const DISPLAY_QR_SIZE_KEY = 'qr_display_size';
const DISPLAY_QR_SIZE_DEFAULT = 220;
let displayQRSize = DISPLAY_QR_SIZE_DEFAULT;

function normalizeDisplayQRSize(value) {
    const numericValue = Number(value);
    if (!Number.isFinite(numericValue)) return DISPLAY_QR_SIZE_DEFAULT;
    const clamped = Math.min(360, Math.max(160, numericValue));
    return Math.round(clamped / 20) * 20;
}

function setDisplayQRSize(value) {
    displayQRSize = normalizeDisplayQRSize(value);
    const content = document.getElementById('singleQRContent');
    const slider = document.getElementById('qrSizeSlider');
    const output = document.getElementById('qrSizeValue');
    if (content) content.style.setProperty('--display-qr-size', displayQRSize + 'px');
    if (slider) slider.value = String(displayQRSize);
    if (output) output.textContent = displayQRSize + 'px';
    try { localStorage.setItem(DISPLAY_QR_SIZE_KEY, String(displayQRSize)); } catch (error) {}
    return displayQRSize;
}

function initializeDisplayQRSize() {
    let storedValue = null;
    try { storedValue = localStorage.getItem(DISPLAY_QR_SIZE_KEY); } catch (error) {}
    setDisplayQRSize(storedValue === null ? DISPLAY_QR_SIZE_DEFAULT : storedValue);
}

function setQRSizeControlVisible(visible) {
    const control = document.getElementById('qrSizeControl');
    if (control) control.hidden = !visible;
}

function getDisplayQRSize() {
    return displayQRSize;
}

function setTextProtocolMode(selectedMode) {
    if (selectedMode !== 'universal' && selectedMode !== 'private') return false;
    textProtocolMode = selectedMode;
    document.querySelectorAll('#textModeSelector .text-protocol-btn').forEach(function(button) {
        button.classList.toggle('active', button.getAttribute('data-text-mode') === selectedMode);
    });
    document.getElementsByName('qrMode').forEach(function(radio) {
        radio.checked = radio.value === selectedMode;
    });
    handleModeChange();
    updateEstimate();
    return true;
}

// ===== Tab Switcher =====
function switchInputTab(tab) {
    document.querySelectorAll('#inputTabSwitcher .tab-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
    });
    document.getElementById('tab-text').style.display = (tab === 'text') ? 'block' : 'none';
    document.getElementById('tab-file').style.display = (tab === 'file') ? 'block' : 'none';
    document.getElementsByName('qrMode').forEach(function(radio) {
        radio.checked = radio.value === (tab === 'text' ? textProtocolMode : 'private');
    });
    handleModeChange();
    if (typeof updateEstimate === 'function') updateEstimate();
}

function getActiveInputType() {
    return document.getElementById('tab-file').style.display !== 'none' ? 'file' : 'text';
}

// ===== Show display sections after generation =====
function showDisplaySections() {
    var ds = document.getElementById('display-section');
    var qs = document.getElementById('qr-output-section');
    if (ds) ds.style.display = 'block';
    if (qs) qs.style.display = 'block';
}

// ===== Auto-detect mode and estimation =====
function updateEstimate() {
    var hint = document.getElementById('estimate-hint');
    var textTab = document.getElementById('tab-text');
    var isTextTab = textTab.style.display !== 'none';
    var radios = document.getElementsByName('qrMode');
    var errorLevel = document.getElementById('errorLevel').value;

    // Capacity map for universal mode (QR Version 40)
    var capacityMap = { 'L': 2953, 'M': 2331, 'Q': 1663, 'H': 1273 };
    var maxCap = capacityMap[errorLevel] || 2953;

    if (isTextTab) {
        var text = document.getElementById('textInput').value;
        if (!text) {
            hint.style.display = 'none';
            return;
        }
        for (var i = 0; i < radios.length; i++) {
            radios[i].checked = radios[i].value === textProtocolMode;
        }
        if (textProtocolMode === 'universal') {
            document.getElementById('universalErrorLevel').value = errorLevel;
            var publicParts = splitPublicText(text, errorLevel);
            hint.textContent = '将生成 ' + publicParts.length + ' 个公有明文二维码（任意标准扫描器可读）';
            hint.style.display = 'block';
        } else {
            var byteLen = new TextEncoder().encode(text).length;
            hint.textContent = '私有 V2 快速拼接 · ' + byteLen + ' 字节 · 支持乱序、恢复与补传';
            hint.style.display = 'block';
        }
    } else {
        // File tab
        if (!currentFile) {
            hint.style.display = 'none';
            return;
        }
        for (var i = 0; i < radios.length; i++) {
            radios[i].checked = (radios[i].value === 'private');
        }
        var est = estimateQRCount(currentFile);
        var scanSec = est.qrCount * 2;
        var timeStr = scanSec >= 60 ? '~' + Math.ceil(scanSec / 60) + '分钟' : '~' + scanSec + '秒';
        hint.textContent = currentFile.name + ' (' + formatBytes(currentFile.size) + ') → 约 ' + est.qrCount + ' 个二维码，预计扫描时间 ' + timeStr;
        hint.style.display = 'block';
    }

    handleModeChange();
}

// ===== 基础工具函数 (Foundational Utilities) =====

// Mode Selection Utilities (T004)
function getSelectedMode() {
    const radioButtons = document.getElementsByName('qrMode');
    for (let radio of radioButtons) {
        if (radio.checked) {
            return radio.value;
        }
    }
    return 'private'; // 默认私有模式
}

function isModeUniversal() {
    return getSelectedMode() === 'universal';
}

function isModePrivate() {
    return getSelectedMode() === 'private';
}

// Text Encoding Utilities (T005)
function encodeForUniversalQR(text) {
    // 检查是否包含非ASCII字符（中文、emoji等）或特殊字符
    const hasNonASCII = /[^\x00-\x7F]/.test(text);
    const problematicChars = /[<>&"']/.test(text);

    if (hasNonASCII || problematicChars) {
        // 应用percent-encoding以避免UTF-8编码问题
        const encoded = encodeURIComponent(text);
        let warningMsg = '';

        if (hasNonASCII && problematicChars) {
            warningMsg = '文本包含中文/特殊字符，已自动编码。扫描后可能显示为编码格式，建议使用私有模式传输中文。';
        } else if (hasNonASCII) {
            warningMsg = '文本包含中文字符，已自动编码。扫描后可能显示为编码格式（如 %E4%B8%AD），建议使用私有模式传输中文。';
        } else {
            warningMsg = '部分特殊字符已编码，可能在某些扫描器显示略有差异。';
        }

        return {
            encoded: encoded,
            needsWarning: true,
            warningMessage: warningMsg,
            original: text
        };
    }
    return {
        encoded: text,
        needsWarning: false,
        warningMessage: '',
        original: text
    };
}

function validateTextLength(text, errorLevel) {
    // QR码容量限制 (Version 40各级别的最大字节数)
    const capacityMap = {
        'L': 2953,  // 7% 纠错
        'M': 2331,  // 15% 纠错
        'Q': 1663,  // 25% 纠错
        'H': 1273   // 30% 纠错
    };

    const maxCapacity = capacityMap[errorLevel] || capacityMap['L'];
    const utf8Bytes = new TextEncoder().encode(text).length;

    return {
        valid: utf8Bytes <= maxCapacity,
        byteLength: utf8Bytes,
        maxCapacity: maxCapacity,
        errorLevel: errorLevel
    };
}

function getFilePolicy(size, selectedLevel) {
    if (!Number.isFinite(size) || size < 0 || size > ABSOLUTE_FILE_MAX_BYTES) {
        return { accepted: false, reason: 'file-too-large', effectiveLevel: selectedLevel };
    }
    const longMode = size > NORMAL_FILE_MAX_BYTES;
    return { accepted: true, longMode: longMode, effectiveLevel: longMode ? 'L' : selectedLevel, requiresConfirmation: longMode };
}

        if (utf8ByteLength(JSON.stringify(sample)) <= capacity) return { chunkSize: chunkSize, total: total };

            const start = (index - 1) * layout.chunkSize;
            return JSON.stringify({ v:2, k:'f', x:transferId, i:index, t:layout.total, d:base64Data.slice(start, start + layout.chunkSize) });
        }
    };
}

function toFixedBase36(value, width) {
    if (!Number.isSafeInteger(value) || value < 0) throw new RangeError('base36-value');
    const encoded = value.toString(36);
    if (encoded.length > width) throw new RangeError('base36-overflow');
    return encoded.padStart(width, '0');
}

function bytesToBase64Url(bytes) {
    const normalized = new Uint8Array(bytes);
    let binary = '';
    for (let offset = 0; offset < normalized.length; offset += 0x8000) {
        binary += String.fromCharCode.apply(null, normalized.subarray(offset, offset + 0x8000));
    }
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}

function calculateUniformV3Layout(objectByteLength, errorLevel) {
    const capacity = PRIVATE_QR_V10_CAPACITY[errorLevel] || PRIVATE_QR_V10_CAPACITY.H;
    const encodedBudget = capacity - UNIFORM_V3_HEADER_BYTES;
    const rawChunkSize = Math.floor(encodedBudget / 4) * 3;
    if (rawChunkSize < 3) throw new Error('V3 分片无法装入目标二维码容量');
    const total = Math.max(1, Math.ceil(objectByteLength / rawChunkSize));
    if (total >= Math.pow(36, UNIFORM_V3_INDEX_WIDTH)) throw new Error('V3 分片数量超出上限');
    return { rawChunkSize: rawChunkSize, total: total, payloadLength: Math.ceil(rawChunkSize / 3) * 4 };
}

function createUniformV3FileSource(objectBytes, transferId, errorLevel) {
    const normalized = new Uint8Array(objectBytes);
    const layout = calculateUniformV3Layout(normalized.length, errorLevel);
    let payloadCalls = 0;
    return {
        kind: 'f', version: 3, id: transferId, length: layout.total,
        objectByteLength: normalized.length, rawChunkSize: layout.rawChunkSize, materializedCount: 0,
        get payloadCalls() { return payloadCalls; },
        getData: function(index) {
            if (!Number.isInteger(index) || index < 0 || index >= layout.total) throw new RangeError('fragment-index');
            payloadCalls++;
            const padded = new Uint8Array(layout.rawChunkSize);
            const start = index * layout.rawChunkSize;
            padded.set(normalized.subarray(start, Math.min(normalized.length, start + layout.rawChunkSize)));
            const header = UNIFORM_V3_MAGIC + transferId +
                toFixedBase36(index, UNIFORM_V3_INDEX_WIDTH) +
                toFixedBase36(layout.total, UNIFORM_V3_INDEX_WIDTH) +
                toFixedBase36(normalized.length, UNIFORM_V3_LENGTH_WIDTH);
            const payload = header + bytesToBase64Url(padded);
            if (utf8ByteLength(payload) > (PRIVATE_QR_V10_CAPACITY[errorLevel] || PRIVATE_QR_V10_CAPACITY.H)) {
                throw new Error('V3 载荷超过目标二维码容量');
            }
            return payload;
        }
    };
}

function utf8Bytes(value) {
    return new TextEncoder().encode(value);
}

function utf8ByteLength(value) {
    return utf8Bytes(value).length;
}

async function sha256Hex(bytes) {
    const normalized = new Uint8Array(bytes);
    const digest = await crypto.subtle.digest('SHA-256', normalized);
    return Array.from(new Uint8Array(digest), function(byte) {
        return byte.toString(16).padStart(2, '0');
    }).join('');
}

function bytesToBase64(bytes) {
    const normalized = new Uint8Array(bytes);
    let binary = '';
    for (let offset = 0; offset < normalized.length; offset += 0x8000) {
        binary += String.fromCharCode.apply(null, normalized.subarray(offset, offset + 0x8000));
    }
    return btoa(binary);
}

let fileProcessingCancelled = false;
function cancelFileProcessing() { fileProcessingCancelled = true; }
async function bytesToBase64Async(bytes, onProgress) {
    const normalized=new Uint8Array(bytes); const batchSize=196608; let result='';
    for(let offset=0;offset<normalized.length;offset+=batchSize){
        if(fileProcessingCancelled)throw new Error('已取消文件处理');
        const chunk=normalized.subarray(offset,Math.min(normalized.length,offset+batchSize));let binary='';
        for(let inner=0;inner<chunk.length;inner+=0x8000)binary+=String.fromCharCode.apply(null,chunk.subarray(inner,inner+0x8000));
        result+=btoa(binary);if(onProgress)onProgress(Math.min(1,(offset+chunk.length)/normalized.length));
        await new Promise(function(resolve){setTimeout(resolve,0);});
    }
    return result;
}

function splitUtf8Text(text, byteBudget) {
    if (byteBudget < 1) throw new Error('二维码文本容量不足');
    const parts = [];
    let current = '';
    let currentBytes = 0;
    for (const codePoint of text) {
        const pointBytes = utf8ByteLength(codePoint);
        if (pointBytes > byteBudget) throw new Error('单个字符超过二维码容量');
        if (current && currentBytes + pointBytes > byteBudget) {
            parts.push(current);
            current = '';
            currentBytes = 0;
        }
        current += codePoint;
        currentBytes += pointBytes;
    }
    if (current || parts.length === 0) parts.push(current);
    return parts;
}

function splitPublicText(text, errorLevel) {
    const maximumCapacity = PUBLIC_QR_CAPACITY[errorLevel] || PUBLIC_QR_CAPACITY.H;
    const singleCapacity = maximumCapacity - (/[^\x00-\x7F]/.test(text) ? 3 : 0);
    if (utf8ByteLength(text) <= singleCapacity) return [text];

    // Reserve enough room for the readable sequence prefix. Recalculate until
    // the final prefix and every Unicode-safe text part fit the QR capacity.
    const capacity = maximumCapacity - 3; // The Chinese sequence prefix makes QRCode.js add a UTF-8 BOM.
    let payloadBudget = capacity - 64;
    while (payloadBudget > 0) {
        const rawParts = splitUtf8Text(text, payloadBudget);
        const total = rawParts.length;
        const result = rawParts.map(function(part, index) {
            return `【QR文本 ${index + 1}/${total}】\n${part}`;
        });
        if (result.every(function(part) { return utf8ByteLength(part) <= capacity; })) {
            return result;
        }
        payloadBudget -= 16;
    }
    throw new Error('文本无法按当前纠错级别拆分');
}

function buildV2Fragments(kind, transferId, base64Data, metadata, errorLevel) {
    const capacity = PRIVATE_QR_V10_CAPACITY[errorLevel] || PRIVATE_QR_V10_CAPACITY.H;
    const maximumChunk = Math.max(8, capacity - 48);

    for (let chunkSize = maximumChunk; chunkSize >= 8; chunkSize--) {
        const chunks = [];
        if (base64Data.length === 0) {
            chunks.push('');
        } else {
            for (let offset = 0; offset < base64Data.length; offset += chunkSize) {
                chunks.push(base64Data.slice(offset, offset + chunkSize));
            }
        }
        const total = chunks.length + 1;
        const fragments = [{ v: 2, k: kind, x: transferId, i: 0, t: total, d: '', m: metadata }];
        chunks.forEach(function(chunk, index) {
            fragments.push({ v: 2, k: kind, x: transferId, i: index + 1, t: total, d: chunk });
        });
        const dataFits = fragments.slice(1).every(function(fragment) {
            return utf8ByteLength(JSON.stringify(fragment)) <= capacity;
        });
        if (dataFits) return fragments;
    }
    throw new Error('V2 分片无法装入目标二维码容量');
}

async function buildPrivateTextTransfer(text, errorLevel) {
    const bytes = utf8Bytes(text);
    const contentHash = await sha256Hex(bytes);
    const id = contentHash.slice(0, 16);
    const fragments = buildV2Fragments('t', id, bytesToBase64(bytes), { h: contentHash, e: 'utf8' }, errorLevel);
    return { id: id, hash: contentHash, fragments: fragments };
}

async function buildFileTransfer(bytes, fileName, mimeType, errorLevel) {
    const normalized = new Uint8Array(bytes);
    const contentHash = await sha256Hex(normalized);
    const descriptor = `${fileName}\u0000${normalized.length}\u0000${contentHash}`;
    const idHash = await sha256Hex(utf8Bytes(descriptor));
    const id = idHash.slice(0, 16);
    const metadata = {
        n: fileName,
        y: mimeType || 'application/octet-stream',
        s: normalized.length,
        h: contentHash
    };
    const fragments = buildV2Fragments('f', id, bytesToBase64(normalized), metadata, errorLevel);
    return { id: id, hash: contentHash, fragments: fragments };
}

async function buildLazyFileTransfer(bytes, fileName, mimeType, errorLevel, onProgress) {
    const normalized = new Uint8Array(bytes);
    const policy = getFilePolicy(normalized.length, errorLevel);
    if (!policy.accepted) throw new Error('文件超过20MiB上限');
    const contentHash = await sha256Hex(normalized);
    const descriptor = `${fileName}\u0000${normalized.length}\u0000${contentHash}`;
    const id = (await sha256Hex(utf8Bytes(descriptor))).slice(0, 16);
    const metadata = { n:fileName, y:mimeType || 'application/octet-stream', s:normalized.length, h:contentHash };
    const source = createLazyV2FileSource(await bytesToBase64Async(normalized,onProgress), id, metadata, policy.effectiveLevel);
    return { id:id, hash:contentHash, source:source, policy:policy };
}

async function buildUniformFileTransfer(bytes, fileName, mimeType, errorLevel) {
    const normalized = new Uint8Array(bytes);
    const policy = getFilePolicy(normalized.length, errorLevel);
    if (!policy.accepted) throw new Error('文件超过20MiB上限');
    const contentHash = await sha256Hex(normalized);
    const descriptor = `${fileName}\u0000${normalized.length}\u0000${contentHash}`;
    const id = (await sha256Hex(utf8Bytes(descriptor))).slice(0, 16);
    const metadata = { n:fileName, y:mimeType || 'application/octet-stream', s:normalized.length, h:contentHash };
    const metadataBytes = utf8Bytes(JSON.stringify(metadata));
    const objectBytes = new Uint8Array(4 + metadataBytes.length + normalized.length);
    new DataView(objectBytes.buffer).setUint32(0, metadataBytes.length, false);
    objectBytes.set(metadataBytes, 4);
    objectBytes.set(normalized, 4 + metadataBytes.length);
    return { id:id, hash:contentHash, metadata:metadata,
        source:createUniformV3FileSource(objectBytes, id, policy.effectiveLevel), policy:policy };
}

// Mode Selection Change Handler (T010, T031)
function handleModeChange() {
    const mode = getSelectedMode();
    const errorLevelContainer = document.getElementById('error-level-container');
    const loopingControls = document.getElementById('loopControls');
    const fileUploadArea = document.getElementById('file-upload-area'); // T031
    const chunkStrategyGroup = document.getElementById('optgroup-chunk');
    const loopSpeedGroup = document.getElementById('optgroup-speed');

    if (mode === 'universal') {
        // 公有文本复用高级选项里的同一个纠错级别选择器。
        errorLevelContainer.style.display = 'none';
        if (chunkStrategyGroup) chunkStrategyGroup.style.display = 'none';
        if (loopSpeedGroup) loopSpeedGroup.style.display = 'none';
        if (loopingControls) loopingControls.style.display = 'none';
        if (fileUploadArea) fileUploadArea.style.display = 'none'; // T031

        // 通用模式不支持文件，恢复按钮文本
        const generateBtn = document.getElementById('generateBtn');
        if (generateBtn) {
            generateBtn.innerHTML = '生成二维码';
            generateBtn.style.background = '';
        }
    } else {
        // 私有模式: 隐藏纠错级别选择器，显示分片策略、循环速度和文件上传
        errorLevelContainer.style.display = 'none';
        if (chunkStrategyGroup) chunkStrategyGroup.style.display = 'block';
        if (loopSpeedGroup) loopSpeedGroup.style.display = 'block';
        if (fileUploadArea) fileUploadArea.style.display = 'block'; // T031
        // loopingControls 会在loop模式被选中时显示

        // 私有模式：根据是否有文件更新按钮文本
        const generateBtn = document.getElementById('generateBtn');
        if (generateBtn) {
            if (currentFile) {
                generateBtn.innerHTML = '📁 生成文件二维码';
                generateBtn.style.background = 'var(--accent)';
            } else {
                generateBtn.innerHTML = '生成二维码';
                generateBtn.style.background = '';
            }
        }
    }

    // 清除之前的消息
    clearMessages();
}

// 全局变量存储当前选中的文件
let currentFile = null;

// Drag and Drop Event Handlers (T032)
document.addEventListener('DOMContentLoaded', function() {
    // 初始化UI状态，根据默认选中的模式显示/隐藏对应区域
    handleModeChange();

    // Wire text input to auto-detect estimation
    var textInput = document.getElementById('textInput');
    if (textInput) {
        textInput.addEventListener('input', updateEstimate);
    }

    // Wire error level change to re-estimate
    var errSel = document.getElementById('errorLevel');
    if (errSel) {
        errSel.addEventListener('change', function() {
            document.getElementById('universalErrorLevel').value = errSel.value;
            updateEstimate();
        });
    }

    const dropZone = document.getElementById('dropZone');
    if (!dropZone) return;

    dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('drag-over');

        const files = e.dataTransfer.files;
        if (files.length > 0) {
            handleFileUpload(files[0]);
        }
    });
});

// File Input Change Handler (T033)
function handleFileInputChange(event) {
    const files = event.target.files;
    if (files.length > 0) {
        handleFileUpload(files[0]);
    }
}

// Handle File Upload (T034)
function handleFileUpload(file) {
    const policy = getFilePolicy(file.size, document.getElementById('errorLevel').value);
    if (!policy.accepted) {
        currentFile = null;
        showError('文件超过20MiB上限，请先压缩或拆分后再传输。');
        const input = document.getElementById('fileInput');
        if (input) input.value = '';
        return;
    }
    currentFile = file;

    // Auto-switch to file tab
    switchInputTab('file');

    // Display file info
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileSize').textContent = formatBytes(file.size);
    document.getElementById('fileType').textContent = file.type || '未知类型';

    // Estimate QR count (T035)
    const estimate = estimateQRCount(file);
    document.getElementById('estimatedQRCount').textContent = estimate.qrCount;
    document.getElementById('estimatedScanTime').textContent = estimate.scanTime;

    // Show file info display
    document.getElementById('file-info-display').style.display = 'block';

    // 更新生成按钮文本，提示用户当前将生成文件QR
    const generateBtn = document.getElementById('generateBtn');
    if (generateBtn) {
        generateBtn.innerHTML = '📁 生成文件二维码';
        generateBtn.style.background = 'var(--accent)';
    }

    // Check for large files and show warning
    if (estimate.qrCount > 100) {
        showWarning(`预计生成${estimate.qrCount}个二维码，扫描需约${estimate.scanTime}分钟。建议压缩文件以减少二维码数量。`);
    }

    // Check for executable files
    const executableExtensions = ['.exe', '.bat', '.sh', '.cmd', '.com', '.app', '.dmg'];
    const fileExtension = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
    if (executableExtensions.includes(fileExtension)) {
        showWarning('检测到可执行文件类型，请确认文件来源安全。');
    }

    console.log(`文件已选择: ${file.name}, 大小: ${file.size} 字节, 预计${estimate.qrCount}个QR码`);

    // Update estimation hint
    updateEstimate();
}

// Estimate QR Count (T035)
// Get chunk sizes based on error correction level
// Higher correction → smaller chunks → more QR codes but similar density
function getChunkSizes(errorLevel) {
    // Target max QR v10 for rest fragments (reliable phone scanning)
    // v10 capacity: L=271, M=213, Q=151, H=119 bytes
    // JSON wrapper overhead: ~48 bytes → data budget = capacity - 48
    const sizes = {
        'L': { rest: 220 },
        'M': { rest: 160 },
        'Q': { rest: 100 },
        'H': { rest: 70 }
    };
    return sizes[errorLevel] || sizes['H'];
}

function estimateQRCount(file, forcedLevel) {
    const errorLevel = forcedLevel || document.getElementById('errorLevel').value;
    const metadataSize = utf8ByteLength(JSON.stringify({n:file.name,y:file.type||'application/octet-stream',s:file.size,h:'0'.repeat(64)}));
    const layout = calculateUniformV3Layout(4 + metadataSize + file.size, errorLevel);
    const qrCount = layout.total;
    const selectedSpeed = Number(document.getElementById('loopSpeed').value) || 100;
    const scanTime = Math.max(1, Math.ceil(qrCount * selectedSpeed / 60000));

    return {
        qrCount: qrCount,
        scanTime: scanTime
    };
}

// Format Bytes (T036)
function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
}

// Generate File QR Codes (T037)
async function generateFileQR() {
    if (!currentFile) {
        showError('请先选择文件');
        return;
    }

    const selectedLevel = document.getElementById('errorLevel').value;
    const policy = getFilePolicy(currentFile.size, selectedLevel);
    if (!policy.accepted) { showError('文件超过20MiB上限，请先压缩或拆分。'); return; }
    if (policy.longMode) {
        const estimate = estimateQRCount(currentFile, 'L');
        if (!confirm(`文件超过5MiB，将使用L级超长模式，约${estimate.qrCount}片，理论播放约${estimate.scanTime}分钟。继续吗？`)) return;
        document.getElementById('errorLevel').value = 'L';
    }
    clearMessages();
    console.log(`开始生成文件QR码: ${currentFile.name}`);

    const display = document.getElementById('qrDisplay');
    fileProcessingCancelled = false;
    display.innerHTML = '<div style="text-align:center;color:var(--text-secondary);"><p id="fileProcessStatus">正在读取文件...</p><progress id="fileProcessProgress" max="100" value="0" style="width:min(360px,90%);margin:12px 0;"></progress><br><button type="button" onclick="cancelFileProcessing()" style="padding:7px 16px;border-radius:980px;border:1px solid var(--border);background:var(--bg-card-hover);color:var(--text-primary);">取消</button></div>';

    // Use FileReader to read file as Base64
    const reader = new FileReader();

    reader.onload = async function(e) {
        try {
            const bytes = new Uint8Array(e.target.result);
            console.log(`文件读取完成: ${bytes.length} 字节`);
            const status=document.getElementById('fileProcessStatus'),progress=document.getElementById('fileProcessProgress');
            if(status)status.textContent='正在计算 SHA-256 并建立均匀分片...';
            const transfer = await buildUniformFileTransfer(bytes, currentFile.name, currentFile.type, policy.effectiveLevel);
            if(progress)progress.value=100;
            console.log(`V3 均匀文件源: ${transfer.source.length} 片, ID=${transfer.id}`);
            generatePrivateQRCodes(transfer.source);

        } catch (error) {
            showError('文件处理失败: ' + error.message);
            console.error('File QR generation error:', error);
        }
    };

    reader.onerror = function() {
        showError('文件读取失败');
        console.error('FileReader error');
    };

    // Read raw bytes so SHA-256 covers the exact original file.
    reader.readAsArrayBuffer(currentFile);
}

// Chunk File (T038)
function chunkFile(file, pureBase64, checksum) {
    const base64 = pureBase64;
    const errorLevel = document.getElementById('errorLevel').value;
    const cs = getChunkSizes(errorLevel);
    const fragments = [];

    // Fragment 0: metadata only, no base64 data.
    // This keeps fragment 0 at QR v11-v12 (61-65 modules) instead of v15+.
    const metaObj = {
        n: file.name,
        m: file.type || 'application/octet-stream',
        s: file.size,
        c: checksum
    };
    fragments.push({
        type: "file",
        index: 0,
        total: 0,
        data: "",
        meta: metaObj
    });

    // Fragment 1+: data only, targeting QR v10 (57x57 modules)
    let position = 0;
    while (position < base64.length) {
        const chunk = base64.substr(position, cs.rest);
        fragments.push({
            type: "file",
            index: fragments.length,
            total: 0,
            data: chunk
        });
        position += cs.rest;
    }

    // Set total count
    fragments.forEach(f => f.total = fragments.length);

    console.log(`文件分片: ${fragments.length}片 (第1片=元数据, 第2-${fragments.length}片=数据, 每片≤${cs.rest}字节)`);
    return fragments;
}

// Calculate Simple Checksum (T039)
function calculateSimpleChecksum(data) {
    // Simple hash for integrity verification
    let hash = 0;
    for (let i = 0; i < data.length; i++) {
        const char = data.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash; // Convert to 32bit integer
    }
    return Math.abs(hash).toString(16);
}

// Helper function to generate private QR codes from fragments (T040 - reuse existing)
function generatePrivateQRCodes(fragments) {
    if (Array.isArray(fragments)) {
        const payloads = fragments.map(function(fragment) { return JSON.stringify(fragment); });
        currentQRSource = { length:payloads.length, materializedCount:payloads.length, getData:function(index){ return payloads[index]; } };
    } else {
        currentQRSource = fragments;
    }
    qrCodes = { length: currentQRSource.length, forEach: function() {} };
    qrCache = new Map();
    retransmitIndices = null;
    gridPage = 0;
    renderGridPage(0);
    console.log(`二维码源已就绪: ${getQRCount()}片，物化=${currentQRSource.materializedCount || 0}`);

    // Switch to grid mode after generation
    setMode('grid');
    
    // FIX: Automatically reset loop range to full range (1 to Total) whenever new QR codes are generated
    resetLoopRange();
    console.log(`循环范围已重置: 第1片 到 第${getQRCount()}片`);

    showDisplaySections();
}

function generateUniversalQR(text) {

    display.innerHTML = '';
    qrCodes = [];
    currentQRSource = null;
    qrCache = {};
    retransmitIndices = null;

        'L': QRCode.CorrectLevel.L,
        'M': QRCode.CorrectLevel.M,
        'Q': QRCode.CorrectLevel.Q,
        'H': QRCode.CorrectLevel.H
    };

    try {
        const parts = splitPublicText(text, errorLevel);
        parts.forEach(function(part, index) {
            const container = document.createElement('div');
            container.className = 'qr-item';
            const qrDiv = document.createElement('div');
            container.appendChild(qrDiv);
            const label = document.createElement('div');
            label.textContent = parts.length === 1

            label.style.marginTop = '10px';

            label.style.color = 'var(--success)';
            container.appendChild(label);
            display.appendChild(container);
            new QRCode(qrDiv, {
                text: part,
                width: 300,
                height: 300,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: correctLevelMap[errorLevel]
            });
            qrCodes.push({ element: container, data: part });
        });

        return true;
    } catch (error) {

}

function chunkText(text, maxSize) {
    // 使用Base64编码解决中文字符问题
    // Base64编码会增加约33%的数据量，但对于大分片，我们可以适当放宽限制
    let effectiveSize = maxSize;
    
    // 获取纠错级别以调整安全系数
    const errorLevel = document.getElementById('errorLevel').value;
    
    // 根据分片大小和纠错级别调整安全系数
    if (errorLevel === 'H') {
        // 高纠错级别，需要更保守
        effectiveSize = Math.floor(maxSize * 0.6);
    } else if (errorLevel === 'Q') {
        effectiveSize = Math.floor(maxSize * 0.7);
    } else if (errorLevel === 'M') {
        effectiveSize = Math.floor(maxSize * 0.8);
    } else {
        // L级纠错，针对不同大小采用不同策略
        if (maxSize <= 15) {
            effectiveSize = maxSize; // 小分片保持原样
        } else if (maxSize <= 30) {
            effectiveSize = Math.floor(maxSize * 0.85); // 中分片减少15%
        } else if (maxSize <= 50) {
            effectiveSize = Math.floor(maxSize * 0.75); // 大分片减少25%
        } else if (maxSize <= 80) {
            effectiveSize = Math.floor(maxSize * 0.65); // 超大分片减少35%，平衡片数和稳定性
        } else {
            effectiveSize = Math.floor(maxSize * 0.6); // 更大分片减少40%
        }
    }
    
    const chunks = [];
    for (let i = 0; i < text.length; i += effectiveSize) {
        chunks.push(text.slice(i, i + effectiveSize));
    }
    
    console.log(`分片策略：原始${maxSize} → 实际${effectiveSize}字符/片，共${chunks.length}片`);
    return chunks;
}

function handleSingleModeKeys(e) {

    const pageInput = document.getElementById('pageNumberInput');

}

function startLoop() {
    if (qrCodes.length === 0) return;

    stopLoop(); // 清除之前的定时器

    if (retransmitIndices && retransmitIndices.length > 0) {
        // 指定片段模式：只循环指定索引
        var rtPos = 0;
        currentIndex = retransmitIndices[0];
        showQRCode(currentIndex);
        updateLoopDisplay();

        loopInterval = setInterval(() => {
            rtPos = (rtPos + 1) % retransmitIndices.length;
            currentIndex = retransmitIndices[rtPos];
            showQRCode(currentIndex);
            updateLoopDisplay();
        }, loopSpeed);
    } else {
        // 正常模式
        // 设置循环起始位置（转换为0基索引）
        currentIndex = Math.max(0, loopStart - 1);
        showQRCode(currentIndex);
        updateLoopDisplay();

        // 根据用户设置的速度切换，只在指定范围内循环
        loopInterval = setInterval(() => {
            currentIndex++;
            // 如果超过结束位置，回到起始位置
            if (currentIndex >= loopEnd) {
                currentIndex = loopStart - 1; // 转换为0基索引
            }
            showQRCode(currentIndex);
            updateLoopDisplay();
        }, loopSpeed);
    }
}

// Unified Show QR Code (Handlers both Fullscreen Single and Inline Loop logic if needed, but primarily Fullscreen now)
function showQRCode(index) {
    const contentDiv = document.getElementById('singleQRContent');
    const infoDiv = document.getElementById('singleQRInfo');

    const qrData = getQRData(index);
    if (contentDiv && qrData !== undefined) {
        // Check QR cache for a pre-rendered data URL image
        if (qrCache instanceof Map && qrCache.has(index)) {
            const cached = qrCache.get(index); qrCache.delete(index); qrCache.set(index, cached);
            contentDiv.innerHTML = '<img src="' + cached + '" style="max-width:100%;max-height:100%;">';
        } else {
            contentDiv.innerHTML = '';
            const vw = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.8);
            const size = Math.floor(vw);
            try {
                new QRCode(contentDiv, {
                    text: qrData,
                    width: size,
                    height: size,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: (function(){ var m={'L':QRCode.CorrectLevel.L,'M':QRCode.CorrectLevel.M,'Q':QRCode.CorrectLevel.Q,'H':QRCode.CorrectLevel.H}; return m[document.getElementById('errorLevel').value] || QRCode.CorrectLevel.H; })()
                });
                // Cache the canvas data URL (canvas is available synchronously after draw)
                var canvas = contentDiv.querySelector('canvas');
                if (canvas) {
                    try {
                        if (!(qrCache instanceof Map)) qrCache = new Map();
                        qrCache.set(index, canvas.toDataURL('image/png'));
                        while (qrCache.size > QR_CACHE_LIMIT) qrCache.delete(qrCache.keys().next().value);
                    } catch(e) {}
                }
            } catch (e) {
                console.error('Generate large QR failed', e);
            }
        }

        // Update Info Text
        let infoText = `第 ${index + 1} / ${qrCodes.length} 张`;
        try {
            const data = JSON.parse(qrData);
            if (data.type === 'file' && (data.meta || data.metadata)) {
                const meta = data.meta || data.metadata;
                const name = meta.n || meta.fileName;
                infoText += ` - ${name}`;
            }
        } catch(e) {}
        infoDiv.textContent = infoText;
    }

    // Sync page number input (F2)
    const pageInput = document.getElementById('pageNumberInput');
    const pageTotal = document.getElementById('pageTotalDisplay');
    if (pageInput) pageInput.value = index + 1;
    if (pageTotal) pageTotal.textContent = qrCodes.length;
}

}

function parseFragmentSelection(raw, total) {
    const parts = String(raw || '').split(/[,，、\s]+/).filter(Boolean);
    const values = new Set(); const invalid = [];
    parts.forEach(function(part) {
        const match = part.match(/^(\d+)(?:-(\d+))?$/);
        if (!match) { invalid.push(part); return; }
        const start = Number(match[1]); const end = match[2] ? Number(match[2]) : start;
        if (start < 1 || end < start || end > total) { invalid.push(part); return; }
        for (let value = start; value <= end; value++) values.add(value - 1);
    });
    return { indices:Array.from(values).sort(function(a,b){return a-b;}), invalid:invalid };
}

let loopEnd = 1;

// 暂停/恢复循环播放
function togglePause() {
    if (!loopInterval && mode !== 'loop') return;
    
    const pauseBtn = document.getElementById('pauseBtn');
    const loopStatus = document.getElementById('loopStatus');
    const fsPauseBtn = document.getElementById('fsPauseBtn');
    const fsLoopStatus = document.getElementById('fsLoopStatus');

    if (isPaused) {
        // 恢复播放
        isPaused = false;
        if (pauseBtn) { pauseBtn.textContent = '⏸ 暂停'; pauseBtn.style.background = 'var(--warning)'; }
        if (loopStatus) { loopStatus.textContent = '▶ 播放中'; loopStatus.style.color = 'var(--success)'; }
        if (fsPauseBtn) { fsPauseBtn.textContent = '⏸ 暂停'; fsPauseBtn.style.background = 'var(--warning)'; fsPauseBtn.style.color = 'var(--bg-primary)'; }
        if (fsLoopStatus) { fsLoopStatus.textContent = '▶ 播放中'; fsLoopStatus.style.color = 'var(--success)'; }
        startLoop();
    } else {
        // 暂停播放
        isPaused = true;
        if (pauseBtn) { pauseBtn.textContent = '▶ 播放'; pauseBtn.style.background = 'var(--success)'; }
        if (loopStatus) { loopStatus.textContent = '⏸ 已暂停'; loopStatus.style.color = 'var(--warning)'; }
        if (fsPauseBtn) { fsPauseBtn.textContent = '▶ 播放'; fsPauseBtn.style.background = 'var(--success)'; fsPauseBtn.style.color = 'var(--bg-primary)'; }
        if (fsLoopStatus) { fsLoopStatus.textContent = '⏸ 已暂停'; fsLoopStatus.style.color = 'var(--warning)'; }
        stopLoop();
    }
}

// 更新循环范围设置
function updateLoopRange() {
    const startInput = document.getElementById('loopStart');
    const endInput = document.getElementById('loopEnd');
    
    let start = parseInt(startInput.value);
    let end = parseInt(endInput.value);
    
    // 边界检查
    if (start < 1) start = 1;
    if (end < start) end = start;
    if (start > qrCodes.length) start = qrCodes.length;
    if (end > qrCodes.length) end = qrCodes.length;
    
    // 更新输入框显示
    startInput.value = start;
    endInput.value = end;
    
    // 更新全局变量
    loopStart = start;
    loopEnd = end;
    
    // 如果当前正在循环播放，重启循环以应用新范围
    if (mode === 'loop' && !isPaused) {
        stopLoop();
        startLoop();
    }
    
    console.log(`循环范围已更新: 第${loopStart}片 到 第${loopEnd}片`);
}

// 重置循环范围到全部
function resetLoopRange() {
    if (qrCodes.length === 0) return;

    document.getElementById('loopStart').value = 1;
    document.getElementById('loopEnd').value = qrCodes.length;

    loopStart = 1;
    loopEnd = qrCodes.length;
    retransmitIndices = null;
    var fnInput = document.getElementById('fragmentNumbersInput');
    if (fnInput) fnInput.value = '';
    var fnStatus = document.getElementById('fragmentNumbersStatus');
    if (fnStatus) {
        var lang = (document.documentElement.lang || 'zh').startsWith('zh') ? 'zh' : 'en';
        fnStatus.textContent = lang === 'zh' ? '输入要循环的片段编号，逗号分隔。留空=全部循环' : 'Enter fragment numbers, comma-separated. Empty=loop all';
        fnStatus.style.color = 'var(--text-muted)';
    }

    // 如果当前正在循环播放，重启循环
    if (mode === 'loop' && !isPaused) {
        stopLoop();
        startLoop();
    }

    console.log(`循环范围已重置: 第1片 到 第${qrCodes.length}片`);
}

// 应用指定片段编号
function applyFragmentNumbers() {
    var input = document.getElementById('fragmentNumbersInput');
    var statusEl = document.getElementById('fragmentNumbersStatus');
    var raw = input ? input.value.trim() : '';
    var lang = (document.documentElement.lang || 'zh').startsWith('zh') ? 'zh' : 'en';

    if (!raw) {
        if (statusEl) {
            statusEl.textContent = lang === 'zh' ? '请输入片段编号' : 'Please enter fragment numbers';
            statusEl.style.color = 'var(--error)';
        }
        return;
    }

    var parsed = parseFragmentSelection(raw, getQRCount());
    var indices = parsed.indices;
    var invalid = parsed.invalid;

    if (invalid.length > 0) {
        if (statusEl) {
            statusEl.textContent = lang === 'zh'
                ? '无效编号: ' + invalid.join(', ') + '（有效范围 1-' + qrCodes.length + '）'
                : 'Invalid: ' + invalid.join(', ') + ' (range 1-' + qrCodes.length + ')';
            statusEl.style.color = 'var(--error)';
        }
        return;
    }

    if (indices.length === 0) {
        if (statusEl) {
            statusEl.textContent = lang === 'zh' ? '未解析到有效编号' : 'No valid numbers found';
            statusEl.style.color = 'var(--error)';
        }
        return;
    }

    // 排序后设置
    indices.sort(function(a, b) { return a - b; });
    retransmitIndices = indices;

    if (statusEl) {
        statusEl.textContent = lang === 'zh'
            ? '指定模式：循环 ' + indices.length + ' 片（第' + indices.map(function(i){return i+1;}).join(', ') + '片）'
            : 'Selected: looping ' + indices.length + ' fragments';
        statusEl.style.color = 'var(--success)';
    }

    // 重启循环
    if (mode === 'loop') {
        stopLoop();
        startLoop();
    }
}

function clearFragmentNumbers() {
    retransmitIndices = null;
    var input = document.getElementById('fragmentNumbersInput');
    if (input) input.value = '';
    var statusEl = document.getElementById('fragmentNumbersStatus');
    var lang = (document.documentElement.lang || 'zh').startsWith('zh') ? 'zh' : 'en';
    if (statusEl) {
        statusEl.textContent = lang === 'zh' ? '已清除，恢复全部循环' : 'Cleared, full loop restored';
        statusEl.style.color = 'var(--text-muted)';
    }

    if (mode === 'loop' && !isPaused) {
        stopLoop();
        startLoop();
    }
}

// 更新循环显示信息
function updateLoopDisplay() {
    var indexText;
    if (retransmitIndices && retransmitIndices.length > 0) {
        var rtPos = retransmitIndices.indexOf(currentIndex);
        indexText = `指定 ${rtPos + 1}/${retransmitIndices.length} (第${currentIndex + 1}片)`;
    } else {
        indexText = qrCodes.length > 0 ? `${currentIndex + 1} / ${qrCodes.length}` : '0 / 0';
    }
    const loopQrIndex = document.getElementById('loopQrIndex');
    if (loopQrIndex) loopQrIndex.textContent = indexText;
    const fsLoopIndex = document.getElementById('fsLoopIndex');
    if (fsLoopIndex) fsLoopIndex.textContent = indexText;
}

// ===== Bilingual Support =====
(function() {
    var stored = null;
    try { stored = localStorage.getItem('qr_lang'); } catch(e) {}
    var lang = stored || ((navigator.language || '').startsWith('zh') ? 'zh' : 'en');

    function applyLang(l) {
        lang = l;
        try { localStorage.setItem('qr_lang', l); } catch(e) {}
        document.querySelectorAll('[data-zh]').forEach(function(el) {
            el.textContent = el.getAttribute('data-' + l) || el.getAttribute('data-en');
        });
        // Handle placeholder attributes
        document.querySelectorAll('[data-placeholder-zh]').forEach(function(el) {
            el.placeholder = el.getAttribute('data-placeholder-' + l) || el.getAttribute('data-placeholder-en');
        });
        document.querySelectorAll('#langToggle button').forEach(function(btn) {
            btn.classList.toggle('active', btn.getAttribute('data-lang') === l);
        });
        document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
    }

    var toggle = document.getElementById('langToggle');
    if (toggle) {
        toggle.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON') {
                applyLang(e.target.getAttribute('data-lang'));
            }
        });
    }

    applyLang(lang);
})();

document.addEventListener('DOMContentLoaded', initializeDisplayQRSize);
</script>
